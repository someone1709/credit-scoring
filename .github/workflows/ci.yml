# Runs every test on each push and pull request, so a change that breaks something shows up on GitHub.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The tests use an in-memory database, so this checks the real migration scripts on real MySQL.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: credit_scoring
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-only-password
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uci_user -pci-only-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B test
      - run: ./mvnw -B -q -DskipTests package
      - name: Start on real MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/credit_scoring
          DB_USERNAME: ci_user
          DB_PASSWORD: ci-only-password
          APP_JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
          APP_DOCUMENT_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktMTIzNDU2Nzg=
        run: |
          java -jar target/backend-*.jar > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/health && exit 0
            sleep 2
          done
          cat app.log
          exit 1

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m training.train
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make throwaway settings
        run: |
          cat > .env <<SETTINGS
          DB_USERNAME=ci_user
          DB_PASSWORD=$(openssl rand -hex 16)
          APP_JWT_SECRET=$(openssl rand -hex 32)
          APP_DOCUMENT_KEY=$(openssl rand -base64 32)
          APP_ADMIN_KEY=$(openssl rand -hex 24)
          SETTINGS
      - run: docker compose up --build -d
      - name: The whole site answers at its one address
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8088/api/v1/health | grep -q '"ml":"UP"'; then
              curl -sf http://localhost:8088/ | grep -q '<div id="root">'
              # A page the browser would normally route to itself must still load.
              curl -sf http://localhost:8088/login | grep -q '<div id="root">'
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
