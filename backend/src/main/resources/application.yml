# Every secret comes from the environment or a local, git-ignored .env file. See .env.example.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: benescore-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/credit_scoring}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # A database made before migrations existed counts as already at version 1.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Above the 5 MB document limit, so a slightly large file gets a clear CHECKS_FAILED result.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  # Behind a proxy, read the visitor's address from it, so sign-in limits apply per visitor.
  forward-headers-strategy: native
  tomcat:
    # Read an oversized upload to the end, so the client gets a clear error instead of a dropped connection.
    max-swallow-size: 12MB
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-minutes: 15
  refresh:
    remember-days: 14
    session-hours: 24
    cookie-secure: ${APP_COOKIE_SECURE:false}
  password-reset:
    minutes: 30
    # Where emailed links point.
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5175}
    # With no mail service, print links to this server's log instead. Local development only.
    log-links: ${APP_LOG_RESET_LINKS:false}
  mail:
    # Any SMTP service. Leave the host empty to turn email off.
    host: ${APP_MAIL_HOST:}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    from: ${APP_MAIL_FROM:}
    start-tls: ${APP_MAIL_STARTTLS:true}
  admin:
    # Unlocks the lender approval page. Leave empty to turn that page off.
    key: ${APP_ADMIN_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  documents:
    encryption-key: ${APP_DOCUMENT_KEY}
  ml:
    # Where the FastAPI service runs. Leave empty to use the labelled rule-based scoring.
    url: ${ML_SERVICE_URL:}
    timeout-seconds: 3
  seed:
    # Set a password to create the demo lenders and beneficiaries on startup.
    demo-password: ${APP_SEED_DEMO_PASSWORD:}
