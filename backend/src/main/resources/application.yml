# Every secret comes from the environment or a local, git-ignored .env file. See .env.example.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: benescore-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/credit_scoring}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Above the 5 MB document limit, so a slightly large file gets a clear CHECKS_FAILED result.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Read an oversized upload to the end, so the client gets a clear error instead of a dropped connection.
    max-swallow-size: 12MB
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-minutes: 15
  refresh:
    remember-days: 14
    session-hours: 24
    cookie-secure: ${APP_COOKIE_SECURE:false}
  password-reset:
    minutes: 30
    # Where the emailed link points. No mail server is set up, see PasswordResetMailer.
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5175}
    log-links: ${APP_LOG_RESET_LINKS:false}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  ml:
    # Where the FastAPI service runs. Leave empty to use the labelled rule-based scoring.
    url: ${ML_SERVICE_URL:}
    timeout-seconds: 3
  seed:
    # Set a password to create the demo lenders and beneficiaries on startup.
    demo-password: ${APP_SEED_DEMO_PASSWORD:}
