# Runs without MySQL. Hibernate builds the tables here because H2 doesn't support all of the migration scripts.
spring:
  datasource:
    url: jdbc:h2:mem:benescore;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  documents:
    encryption-key: dGVzdC1vbmx5LWtleS10ZXN0LW9ubHkta2V5LTEyMzQ=
  ml:
    url: ""
  admin:
    key: test-admin-key
  jwt:
    secret: test-only-secret-that-is-long-enough-for-hs256
