# Runs MySQL, the ML service and the backend. Values come from a .env file next to this one (see backend/.env.example).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: credit_scoring
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # No published port: only the backend can reach it.
  ml-service:
    build: ./ml-service

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/credit_scoring
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_DOCUMENT_KEY: ${APP_DOCUMENT_KEY:?Set APP_DOCUMENT_KEY in .env}
      ML_SERVICE_URL: http://ml-service:8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
