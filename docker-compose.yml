# Runs the whole site at one address, http://localhost:8088. Values come from a .env file next to this one (see backend/.env.example).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: credit_scoring
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # No published port: only the backend can reach it. The same goes for the backend, behind the frontend.
  ml-service:
    build: ./ml-service

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/credit_scoring
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_DOCUMENT_KEY: ${APP_DOCUMENT_KEY:?Set APP_DOCUMENT_KEY in .env}
      ML_SERVICE_URL: http://ml-service:8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8088}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8088}
      # Set to true when the site is served over HTTPS.
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_ADMIN_KEY: ${APP_ADMIN_KEY:-}
      APP_MAIL_HOST: ${APP_MAIL_HOST:-}
      APP_MAIL_PORT: ${APP_MAIL_PORT:-587}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_STARTTLS: ${APP_MAIL_STARTTLS:-true}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-}

  # The one published port. It serves the website and passes /api on to the backend.
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:8080"

volumes:
  mysql_data:
